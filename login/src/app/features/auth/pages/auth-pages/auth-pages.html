<div class="flex flex-col justify-center items-center h-full ">
    <div
        class="flex flex-col-reverse md:flex-row max-w-[400px] min-h-[600px] md:max-w-[1000px] md:min-h-0 bg-primary mx-3 rounded-4xl overflow-hidden shadow-lg shadow-black/30
h-1/2">
        <div class="flex flex-col p-10 pt-36 gap-y-4">
            <app-input
                placeholder="Email..."
                [(state)]="email"
            />
            <app-input
                placeholder="Password"
                [(state)]="password"
            />
            <button
                class="button"
                (click)="service.login(email(), password())"

            >Enviar</button>

        </div>

        <div class="flex-1 bg-gold min-h-[205] amd:amin-w-[550px] lg:min-w-[550px] shadow-black/40 shadow-md">
            <div
                class="w-full h-full"
                style="background-image: url('/gold.jpg'); background-size: cover; background-position: center">
            </div>
        </div>
    </div>
</div>
