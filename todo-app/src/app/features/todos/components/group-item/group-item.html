<a [routerLink]="['/todos', group().id]">


<div
  class="flex items-center justify-between w-96
         bg-white border border-gray-200 rounded-2xl
         px-5 py-4 shadow-sm
         transition-all duration-200
         hover:shadow-md hover:-translate-y-0.5 text-gray-800"
>
  <div class="min-w-0">
    <h3 class="text-lg font-semibold  truncate">
      {{ group().title }}
    </h3>
  </div>

  <div class="flex items-center gap-3">
    <app-tower-item
      top="Active"
      color="red"
      [bottom]="count().active.toString()"
    />
    <app-tower-item
      top="Done"
      color="green"
      [bottom]="count().done.toString()"
    />
    <app-tower-item
      top="Total"
      color="blue"
      [bottom]="count().total.toString()"
    />
  </div>
</div>

</a>
