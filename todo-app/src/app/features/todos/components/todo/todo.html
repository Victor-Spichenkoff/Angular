<app-card
    [notTranslate]="true"
>
    @if (isEdit()) {
        <div class="flex justify-between">
            // todo Fazer 2 way biding
            <app-input
                placeholder="Label"
                [state]="todoNewName"
            />
            {{ todoNewName() }}
            <button
                (click)="toggleEdit()"
                class="spect-square p-1 border-2 border-blue-500 hover:bg-blue-500 font-bold text-5xl rounded-xl">
                <app-icon name="check" size="lg" />
            </button>
        </div>
    } @else {

        <!--  Marcador-->
        <div class="flex items-center gap-x-2 text-xl font-bold">
            <input
                class="size-6 -mb-1"
                type="checkbox"
                [value]="todo().isDone"
                [ngModel]="todo().isDone"
                (click)="toggleTodoEvent.emit(todo().id)"
            />
            <!--  texto-->
            <div>
                {{ todo().label }}
            </div>
        </div>

        <!--  Ações -->
        <div class="flex gap-x-4">
            <button
                (click)="toggleEdit()"
                class="aspect-square p-1 border-2 border-green-500 hover:bg-green-500 font-bold rounded-xl">
                <app-icon name="edit" size="lg" />
            </button>
            <button class="spect-square p-1 border-2 border-red-500 hover:bg-red-500 font-bold text-5xl rounded-xl">
                <app-icon name="trash" size="lg" />
            </button>

        </div>
    }

</app-card>
