<app-card
    [isStatic]="true"
>
    @if (isEdit()) {
        <!--        MODO EDIÇÃO-->
        <div class="flex justify-between w-full items-center">
            <app-input
                (keyup.esc)="cancelEdit()"
                (keyup.enter)="saveEdit()"
                class="text-xl mr-2 box-border"
                placeholder="Label (enter)"
                [(state)]="todoNewName"
            />
            <div class="flex gap-x-4 items-center">
                <button
                    (click)="saveEdit()"
                     class="aspect-square p-2 w-auto border-2  border-blue-500 hover:bg-blue-500 font-bold rounded-xl">
                    <app-icon name="disk" size="lg" />
                </button>
                <button
                    (click)="cancelEdit()"
                     class="aspect-square p-2 w-auto border-2  border-red-500 hover:bg-red-500 font-bold rounded-xl">
                    <app-icon name="close" size="lg" />
                </button>
            </div>
        </div>
    } @else {

        <!--  Marcador-->
        <div class="flex items-center gap-x-2 text-xl font-bold">
            <input
                class="size-6 -mb-1"
                type="checkbox"
                [value]="todo().isDone"
                [ngModel]="todo().isDone"
                (click)="toggleTodoEvent.emit(todo().id)"
            />
            <!--  texto-->
            <div>
                {{ todo().label }}
            </div>
        </div>

        <!--  Ações -->
        <div class="flex gap-x-4 items-center">
            <button
                (click)="toggleEdit()"
                class="aspect-square p-2 w-auto border-2 border-green-500 hover:bg-green-500 font-bold rounded-xl">
                <app-icon name="edit" size="lg" />
            </button>
            <button
                (click)="removeTodo()"
                class="aspect-square p-2 w-auto border-2 border-red-500 hover:bg-red-500 font-bold rounded-xl">
                <app-icon name="trash" size="lg" />
            </button>
        </div>
    }

</app-card>
