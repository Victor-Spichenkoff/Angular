<app-card>

  <!--  Marcador-->
  <div class="flex items-center gap-x-2 text-xl font-bold">
    <input
      class="size-6 -mb-1"
      type="checkbox"
      [value]="todo().isDone"
      [ngModel]="todo().isDone"
      (click)="toggleTodoEvent.emit(todo().id)"
    />
    <!--  texto-->
    <div>
      {{ todo().label }}
    </div>

  </div>

  <!--  Ações -->
  <div class="flex gap-x-4">
    <button class="w-12 h-12  overflow-hidden bg-green-500 font-bold text-5xl p-2 rounded-xl">E</button>
    <button class="w-12 h-12  overflow-hidden bg-red-500 font-bold text-5xl rounded-xl">X</button>

  </div>
</app-card>
