<div class="p-8">

    <app-card-input
        (submitEvent)="addTodo($event)"
        placeholder="Label..."
    />


    <div class="flex flex-col gap-y-4">
        @for (todo of allTodos(); track todo.id) {
            <app-todo
                [todo]="todo"
                (toggleTodoEvent)="toggleTodo($event)"
            />
        }

    </div>
</div>
