<div class="p-4">
    <app-card-input
         placeholder="Group name..."
         (submitEvent)="addGroup($event)"
    />

    <div class="flex flex-col gap-y-4">
        @for (group of groups(); track group.id) {
            <app-group-item
                [group]="group" />
        }
    </div>
</div>
